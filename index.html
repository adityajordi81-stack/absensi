<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk · RuangHadir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/app.css">
    <script src="assets/app.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-story">
            <a class="brand brand-light" href="index.html"><span class="brand-mark">R</span><span>ruang<span class="brand-soft">hadir</span></span></a>
            <div class="story-copy">
                <span class="eyebrow">WORK, IN GOOD RHYTHM</span>
                <h1>Hari yang baik<br>dimulai dari hadir.</h1>
                <p>Kelola kehadiran tim, catat waktumu, dan jaga semua tetap selaras.</p>
            </div>
            <div class="story-foot">RUANGHADIR <span>·</span> WORKPLACE, IN SYNC</div>
        </section>

        <section class="auth-panel">
            <div class="auth-form-wrap">
                <span class="eyebrow">SELAMAT DATANG KEMBALI</span>
                <h2>Masuk ke akunmu</h2>
                <p class="muted">Lanjutkan aktivitas kerja hari ini.</p>

                <form method="post" class="form-stack" action="index.html">
                    <label>Email
                        <input name="email" type="email" required autofocus autocomplete="username" placeholder="nama@perusahaan.id">
                    </label>
                    <label>Kata sandi
                        <input name="password" type="password" required autocomplete="current-password" placeholder="Masukkan kata sandi">
                    </label>
                    <button class="button button-primary button-wide" type="submit">Masuk <span aria-hidden="true">→</span></button>
                </form>

                <p class="auth-note">Belum memasang aplikasi? <a href="install.html">Mulai instalasi</a></p>
            </div>
        </section>
    </main>
</body>
</html>
