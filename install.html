<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instalasi · RuangHadir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-story">
            <a class="brand brand-light" href="install.html"><span class="brand-mark">R</span><span>ruang<span class="brand-soft">hadir</span></span></a>
            <div class="story-copy">
                <span class="eyebrow">MULAI DARI SINI</span>
                <h1>Ruang kerja,<br>lebih tertata.</h1>
                <p>Buat akun administrator untuk mulai mengelola kehadiran dan tim Anda.</p>
            </div>
            <div class="story-foot">PENCATATAN KEHADIRAN, TANPA RIBET.</div>
        </section>

        <section class="auth-panel">
            <div class="auth-form-wrap">
                <span class="eyebrow">PENGATURAN AWAL</span>
                <h2>Pasang RuangHadir</h2>
                <p class="muted">Buat akun admin pertama. Database akan disiapkan otomatis.</p>

                <form method="post" class="form-stack" action="index.html">
                    <label>Nama administrator
                        <input name="name" required autocomplete="name" placeholder="Nama lengkap">
                    </label>
                    <label>Email
                        <input type="email" name="email" required autocomplete="email" placeholder="nama@perusahaan.id">
                    </label>
                    <label>Kata sandi
                        <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter">
                    </label>
                    <button class="button button-primary button-wide" type="submit">Buat akun admin <span aria-hidden="true">→</span></button>
                </form>

                <p class="auth-note">Konfigurasi database ada di <strong>config.php</strong>.</p>
            </div>
        </section>
    </main>
</body>
</html>
